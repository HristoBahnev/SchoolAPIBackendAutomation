name: CI - Build, Test, and Report (Windows)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
      # Check out your repository so the workflow can access your code.
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up the .NET 8.0 SDK.
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      # Cache NuGet packages to speed up the build process.
      - name: Cache NuGet Packages
        uses: actions/cache@v3
        with:
          # On Windows, the NuGet packages are stored under the USERPROFILE directory.
          path: ${{ env.USERPROFILE }}\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Restore project dependencies.
      - name: Restore Dependencies
        run: dotnet restore

      # Build the project using the Release configuration.
      - name: Build Project
        run: dotnet build --configuration Release --no-restore

      # Run tests with normal verbosity.
      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Locate the test report file.
      # This step searches in the expected folder and exports the report's name to the environment.
      - name: Find Report File
        if: always()
        id: find_report
        run: |
          $report = Get-ChildItem -Path ./BackEndAutomation/BackEndAutomation/bin/Release/net8.0/ -Filter "TestReport_*.html" | Select-Object -First 1
          echo "REPORT_NAME=$($report.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      # Upload the generated test report as an artifact.
      - name: Upload Test Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ./BackEndAutomation/BackEndAutomation/bin/Release/net8.0/TestReport_*.html
          retention-days: 7
